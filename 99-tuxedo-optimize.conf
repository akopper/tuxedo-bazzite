# Optimize initramfs for TUXEDO Stellaris/Polaris AMD+NVIDIA laptops
#
# Remove unnecessary drivers from the initramfs that are force-loaded
# by upstream bazzite dracut configs (99-nvidia.conf, 80-vfio.conf)
# but are not needed on this hardware:
#
# - i915: no Intel GPU present (AMD iGPU + NVIDIA dGPU)
# - nvidia_peermem: GPUDirect RDMA, not applicable on laptops
# - vfio / vfio_iommu_type1 / vfio-pci: only needed for VM GPU passthrough
#
# This reduces initramfs size and speeds up dracut-pre-udev significantly.
omit_drivers+=" nvidia_peermem vfio vfio_iommu_type1 vfio-pci "