# keyd configuration for the TUXEDO image
#
# CapsLock: tap = Esc, hold = nav
# Right Alt: tap = AltGr, hold = nav
#
# The nav layer follows DreymaR's Extend layer where keyd can express it:
# https://dreymar.colemak.org/layers-extend.html
# Deviations:
#  - YUIOP / HJKL; use the TUXEDO-specific cluster from the user config.
#  - M/N/B are LMB/RMB/MMB (DreymaR uses B/N/M in a different order).
#  - keyd cannot move the pointer, so DreymaR's pointer-motion keys become
#    the arrow keys (cursor navigation): T/G = up/down, comma/period = left/right.
#    W/S remain wheel up/down.
#  - F1/F2/F3 are media previous/play-pause/next instead of F1-F12.

[ids]
*

[main]
# Tap CapsLock = Esc, hold = Nav layer
capslock = overload(nav, esc)
# Tap right Alt = AltGr, hold = Nav layer
rightalt = overload(nav, layer(altgr))

[nav]
# Function row: media controls only (no F1-F12 on the nav layer)
f1 = previoussong
f2 = playpause
f3 = nextsong

# Number row stays the number row.

# QWERTY row
q = esc
w = scrollup
e = back
r = forward
t = up
y = pageup
u = home
i = up
o = end
p = pagedown
leftbrace = esc
rightbrace = insert
backslash = favorites

# Home row
a = layer(alt)
s = scrolldown
d = layer(shift)
f = layer(control)
g = down
h = backspace
j = left
k = down
l = right
semicolon = delete

# Bottom row
z = C-z
x = C-x
c = C-c
v = C-v
b = middlemouse
n = rightmouse
m = leftmouse
comma = left
dot = right
slash = compose
space = enter
