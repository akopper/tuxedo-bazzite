name: Build Custom Images

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "05 10 * * 1,4"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  IMAGE_DESC: "Bazzite with Tuxedo drivers (TCC + kmod) for Tuxedo/Clevo laptops"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  # The single image this repo ships. Additional variants were discontinued
  # in Oct 2026 (each image costs ~45 minutes of CI); their Containerfiles
  # were removed with them.
  IMAGE_NAME: "tuxedo-bazzite-gnome-niri-nvidia"
  CONTAINERFILE: "Containerfiles/bazzite-gnome-niri-nvidia/dx/Containerfile"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free Disk Space (Ubuntu)
        uses: ublue-os/remove-unwanted-software@v9
        with:
          # The action's apt cleanup fails on ubuntu-26.04 with
          # "E: Unable to locate package powershell" (pwsh is not an apt package any more)
          # and runs under `set -euo pipefail`, which would kill the job.
          remove-large-packages: false

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Write akmods signing keys
        id: akmods_keys
        env:
          AKMODS_PRIVATE_KEY_B64: ${{ secrets.AKMODS_PRIVATE_KEY_B64 }}
          AKMODS_PUBLIC_KEY_B64: ${{ secrets.AKMODS_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_DIR="${RUNNER_TEMP}/akmods"
          install -d -m 700 "${KEY_DIR}"
          echo "dir=${KEY_DIR}" >> $GITHUB_OUTPUT
          # Fork PRs do not get repo secrets: write empty files so the build
          # still runs (unsigned, kmodgenca generates an ephemeral key).
          if [ -n "${AKMODS_PRIVATE_KEY_B64}" ] && [ -n "${AKMODS_PUBLIC_KEY_B64}" ]; then
            printf '%s' "${AKMODS_PRIVATE_KEY_B64}" | base64 -d > "${KEY_DIR}/private.priv"
            printf '%s' "${AKMODS_PUBLIC_KEY_B64}" | base64 -d > "${KEY_DIR}/public.der"
            # Fail fast on garbage instead of building an unusable image.
            openssl pkey -in "${KEY_DIR}/private.priv" -noout
            openssl x509 -inform DER -in "${KEY_DIR}/public.der" -noout
            chmod 600 "${KEY_DIR}/private.priv" "${KEY_DIR}/public.der"
          else
            echo "::warning::AKMODS_PRIVATE_KEY_B64/AKMODS_PUBLIC_KEY_B64 not set - building WITHOUT module signing"
            : > "${KEY_DIR}/private.priv"
            : > "${KEY_DIR}/public.der"
          fi

      - name: Image Metadata
        uses: docker/metadata-action@v6
        id: metadata
        with:
          tags: |
            type=raw,value=latest
            type=raw,value=latest.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=latest
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v3
        with:
          context: .
          containerfiles: ${{ env.CONTAINERFILE }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false
          extra-args: |
            --secret=id=akmods_private_key,src=${{ steps.akmods_keys.outputs.dir }}/private.priv
            --secret=id=akmods_public_key,src=${{ steps.akmods_keys.outputs.dir }}/public.der

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      - name: Lowercase Image
        id: image_case
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ env.IMAGE_NAME }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        uses: redhat-actions/push-to-registry@v3
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          registry: ${{ steps.registry_case.outputs.lowercase }}
          image: ${{ steps.image_case.outputs.lowercase }}
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE_FULL="${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL:$tag
          done
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
